<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="100%" height="100%" fill="#101d2e"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#e7edf7}.muted{fill:#a9b8cb}.head{font-size:32px;font-weight:700}.sub{font-size:19px}.small{font-size:16px}.box{fill:#1b3048;stroke:#4b7297;stroke-width:2}.line{stroke:#74b6db;stroke-width:4;fill:none}</style><text x="65" y="70" class="head">天然气从哪里来？</text><text x="65" y="110" class="sub muted">以筇竹寺组海相有机质热成因气为例</text><rect x="35" y="210" width="205" height="125" rx="18" class="box"/><text x="137" y="258" text-anchor="middle" class="sub">古海洋生物</text><text x="137" y="292" text-anchor="middle" class="small muted">藻类、微生物</text><rect x="280" y="210" width="205" height="125" rx="18" class="box"/><text x="382" y="258" text-anchor="middle" class="sub">有机质埋藏</text><text x="382" y="292" text-anchor="middle" class="small muted">形成干酪根</text><rect x="525" y="210" width="205" height="125" rx="18" class="box"/><text x="627" y="258" text-anchor="middle" class="sub">升温成熟</text><text x="627" y="292" text-anchor="middle" class="small muted">生油及生气</text><rect x="770" y="210" width="205" height="125" rx="18" class="box"/><text x="872" y="258" text-anchor="middle" class="sub">进一步加热</text><text x="872" y="292" text-anchor="middle" class="small muted">油裂解生气</text><rect x="1015" y="210" width="205" height="125" rx="18" class="box"/><text x="1117" y="258" text-anchor="middle" class="sub">气藏保存</text><text x="1117" y="292" text-anchor="middle" class="small muted">甲烷为主</text><path d="M240 272 h35" class="line"/><path d="M268 264 l10 8 -10 8" class="line"/><path d="M485 272 h35" class="line"/><path d="M513 264 l10 8 -10 8" class="line"/><path d="M730 272 h35" class="line"/><path d="M758 264 l10 8 -10 8" class="line"/><path d="M975 272 h35" class="line"/><path d="M1003 264 l10 8 -10 8" class="line"/><text x="65" y="440" class="sub">注意：过成熟 ≠ 甲烷已经失去价值，也 ≠ 一定没有天然气。</text><text x="65" y="490" class="sub">Ro 记录岩石有机质经历过多强的热演化，不是天然气本身的成熟度。</text></svg>