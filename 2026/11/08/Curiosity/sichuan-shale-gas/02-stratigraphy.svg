<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="100%" height="100%" fill="#101d2e"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#e7edf7}.muted{fill:#a9b8cb}.head{font-size:32px;font-weight:700}.sub{font-size:19px}.small{font-size:16px}.box{fill:#1b3048;stroke:#4b7297;stroke-width:2}.line{stroke:#74b6db;stroke-width:4;fill:none}</style><text x="65" y="70" class="head">筇竹寺组：地下岩层像一块多层蛋糕</text><text x="65" y="110" class="sub muted">垂向层序概念示意，不代表真实厚度</text><rect x="220" y="160" width="740" height="80" rx="9" fill="#4a6978"/><text x="590" y="207.0" text-anchor="middle" class="sub">沧浪铺组：上覆层（区域顶板）</text><rect x="220" y="248" width="740" height="145" rx="9" fill="#324c62"/><text x="590" y="327.5" text-anchor="middle" class="sub">筇竹寺组：富有机质页岩（生气 + 储气）</text><rect x="220" y="402" width="740" height="75" rx="9" fill="#58646a"/><text x="590" y="446.5" text-anchor="middle" class="sub">麦地坪组：下伏层（部分地区保存较好）</text><rect x="220" y="486" width="740" height="70" rx="9" fill="#6e6357"/><text x="590" y="528.0" text-anchor="middle" class="sub">灯影组：更老的碳酸盐岩</text><text x="65" y="603" class="small muted">注：威远部分地区麦地坪组薄或缺失，不能假定所有地方封闭性相同</text></svg>