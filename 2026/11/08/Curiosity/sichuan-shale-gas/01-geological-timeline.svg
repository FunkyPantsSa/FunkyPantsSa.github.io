<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="100%" height="100%" fill="#101d2e"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#e7edf7}.muted{fill:#a9b8cb}.head{font-size:32px;font-weight:700}.sub{font-size:19px}.small{font-size:16px}.box{fill:#1b3048;stroke:#4b7297;stroke-width:2}.line{stroke:#74b6db;stroke-width:4;fill:none}</style><text x="65" y="75" class="head">四川盆地：六亿年地质演化简图</text><text x="65" y="112" class="muted sub">时间从左向右：由古到今（示意，不按精确比例）</text><path d="M90 315 H1110" class="line"/><circle cx="100" cy="315" r="11" fill="#f6b85c"/><text x="100" y="270" text-anchor="middle" class="sub">600 Ma</text><text x="100" y="355" text-anchor="middle" class="small">震旦纪</text><text x="100" y="380" text-anchor="middle" class="small muted">古隆起雏形</text><circle cx="305" cy="315" r="11" fill="#f6b85c"/><text x="305" y="270" text-anchor="middle" class="sub">520 Ma</text><text x="305" y="355" text-anchor="middle" class="small">早寒武世</text><text x="305" y="380" text-anchor="middle" class="small muted">筇竹寺组沉积</text><circle cx="505" cy="315" r="11" fill="#f6b85c"/><text x="505" y="270" text-anchor="middle" class="sub">420 Ma</text><text x="505" y="355" text-anchor="middle" class="small">志留纪末</text><text x="505" y="380" text-anchor="middle" class="small muted">抬升剥蚀</text><circle cx="705" cy="315" r="11" fill="#f6b85c"/><text x="705" y="270" text-anchor="middle" class="sub">260 Ma</text><text x="705" y="355" text-anchor="middle" class="small">二叠纪</text><text x="705" y="380" text-anchor="middle" class="small muted">异常热事件</text><circle cx="905" cy="315" r="11" fill="#f6b85c"/><text x="905" y="270" text-anchor="middle" class="sub">100 Ma</text><text x="905" y="355" text-anchor="middle" class="small">晚白垩世</text><text x="905" y="380" text-anchor="middle" class="small muted">埋藏后抬升</text><circle cx="1100" cy="315" r="11" fill="#f6b85c"/><text x="1100" y="270" text-anchor="middle" class="sub">0 Ma</text><text x="1100" y="355" text-anchor="middle" class="small">今天</text><text x="1100" y="380" text-anchor="middle" class="small muted">保存与勘探</text><text x="65" y="515" class="sub">核心：沉积 → 埋藏 → 加热生烃 → 构造改造 → 现今气藏</text><text x="65" y="560" class="small muted">原创科普示意图｜具体构造阶段因地区而异</text></svg>