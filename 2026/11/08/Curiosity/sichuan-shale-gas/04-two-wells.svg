<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="100%" height="100%" fill="#101d2e"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#e7edf7}.muted{fill:#a9b8cb}.head{font-size:32px;font-weight:700}.sub{font-size:19px}.small{font-size:16px}.box{fill:#1b3048;stroke:#4b7297;stroke-width:2}.line{stroke:#74b6db;stroke-width:4;fill:none}</style><text x="65" y="70" class="head">Z201 与 WY1H：同一地层，不同地质经历</text><text x="65" y="108" class="sub muted">概念剖面：只说明相对构造位置，不是实测地形或埋藏史曲线</text><path d="M90 235 Q280 245 455 400 Q650 500 845 360 Q970 250 1100 235" stroke="#d4b36d" stroke-width="12" fill="none"/><path d="M90 260 Q280 270 455 425 Q650 525 845 385 Q970 275 1100 260" stroke="#537f9b" stroke-width="26" fill="none"/><path d="M90 295 Q280 305 455 460 Q650 560 845 420 Q970 310 1100 295" stroke="#6a8b7a" stroke-width="16" fill="none"/><path d="M650 190 V500 M955 150 V305" stroke="#f7c76b" stroke-width="4" stroke-dasharray="8 7"/><text x="650" y="165" text-anchor="middle" class="sub">Z201：槽内资中</text><text x="955" y="130" text-anchor="middle" class="sub">WY1H：槽缘威远</text><text x="80" y="585" class="small muted">论文模拟最终 Ro：Z201 约 3.48%；WY1H 约 3.13%；两者均为过成熟。</text></svg>